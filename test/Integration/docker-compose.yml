services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: Password1
      MSSQL_SA_PASSWORD: Password1
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
    volumes:
      - ./TestUtilities/Scripts/init-sql.sh:/init-sql.sh
    entrypoint: bash /init-sql.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password1' -No -d ActionCache -Q 'SELECT TOP 1 * FROM dbo.DistributedCache'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "8080:8080"
    environment:
      PROTOCOL: https
    healthcheck:
      # An HTTP probe, not a port probe. The emulator opens 8081 well before it can serve:
      # a TCP check reports healthy while requests still 404, so `up --wait` returns and the
      # suite starts against an emulator that is not ready.
      #
      # It also degrades in place. An emulator left running for days keeps the port open and
      # answers every write with a 500, which a port check cannot see -- three expiration
      # tests failed for days and read as flakes because the container still said "healthy".
      # Fetching a real endpoint fails in both cases.
      test: ["CMD-SHELL", "curl -skf https://localhost:8081/_explorer/emulator.pem > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
