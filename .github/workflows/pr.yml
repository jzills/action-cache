name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ActionCache.slnx

      - name: Build
        run: dotnet build ActionCache.slnx --no-restore

      - name: Test
        run: dotnet test test/Unit/Unit.csproj --no-build --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Start services
        run: docker compose -f test/Integration/docker-compose.yml up -d --wait

      - name: Restore
        run: dotnet restore ActionCache.slnx

      - name: Build
        run: dotnet build ActionCache.slnx --no-restore

      - name: Test
        run: dotnet test test/Integration/Integration.csproj -p:TestTfmsInParallel=false --no-build --verbosity normal

  package-dependencies:
    name: Package Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ActionCache.slnx --configuration Release --output ./nupkg

      - name: Assert the core package carries no backend dependencies
        run: bash .github/scripts/verify-package-dependencies.sh ./nupkg
