name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Unit
        run: dotnet restore

      - name: Build
        working-directory: ./test/Unit
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Unit
        run: dotnet test --no-build --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Password1
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password1 -No -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 3
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: false
        options: >-
          --health-cmd "curl -kf https://localhost:8081/_explorer/emulator.pem"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Initialize SQL Server
        run: |
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Password1" -No -Q "CREATE DATABASE ActionCache"
          dotnet tool install --global dotnet-sql-cache
          ~/.dotnet/tools/dotnet-sql-cache create \
            "Server=localhost;Database=ActionCache;User Id=sa;Password=Password1;Encrypt=True;TrustServerCertificate=True;" \
            dbo DistributedCache

      - name: Restore
        working-directory: ./test/Integration
        run: dotnet restore

      - name: Build
        working-directory: ./test/Integration
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Integration
        run: dotnet test --no-build --verbosity normal
