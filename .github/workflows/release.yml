name: Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run unit tests
        run: dotnet test test/Unit/Unit.csproj --verbosity normal

      # Sequential per framework — see the note in pr.yml.
      - name: Run integration tests (net8.0)
        run: dotnet test test/Integration/Integration.csproj -f net8.0 --verbosity normal

      - name: Run integration tests (net10.0)
        run: dotnet test test/Integration/Integration.csproj -f net10.0 --verbosity normal

  publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          VERSION=$(bash .github/scripts/extract-version.sh "${GITHUB_REF#refs/heads/}")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: >
          dotnet pack ActionCache.slnx
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output ./nupkg

      - name: Assert the core package carries no backend dependencies
        run: bash .github/scripts/verify-package-dependencies.sh ./nupkg

      # Dependency order, not glob order. NuGet pushes are not transactional, so if one
      # fails partway the packages already published should still resolve: Abstractions
      # before the core that depends on it, core before the backends that depend on it.
      # Each push also uploads the matching .snupkg automatically.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          for package in ActionCache.Abstractions ActionCache ActionCache.Redis ActionCache.SqlServer ActionCache.AzureCosmos; do
            echo "Pushing $package.$VERSION"
            dotnet nuget push "./nupkg/$package.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  merge:
    name: Open PR to Main
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      pull-requests: write
    steps:
      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${{ needs.publish.outputs.version }}" \
            --body "Automated release PR for v${{ needs.publish.outputs.version }}. Package published to NuGet successfully." \
            --base main \
            --head "${{ github.ref_name }}")
          gh pr merge "$PR_URL" --merge --auto
