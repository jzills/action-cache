# Hugo configuration for the ActionCache documentation site.
#
# A landing page at / and the documentation under /docs/. The docs layout is
# Hextra's own — adding content/docs/ is what turns on the sidebar, the
# right-hand table of contents and the search below.
# j.zills.io is the custom domain on the owner's user site, which GitHub Pages
# applies to this project site too; jzills.github.io/action-cache/ answers
# with a 301 to it, so it is not the canonical URL.
baseURL = "https://j.zills.io/action-cache/"

# The name, not the tagline. This is both the navbar text and the browser tab's,
# and the tagline set here rendered in the navbar directly above a hero saying the
# same thing. Hextra titles the home page with this alone and every other page as
# "Page – this", so the name is what distinguishes a tab among many.
title = "ActionCache"

# No tag or category pages: no page has either, so Hugo's default /tags/ and
# /categories/ were empty, and listed in the sitemap they were indexed as thin
# pages.
disableKinds = ["taxonomy", "term"]

[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the library's build.
# There is no other Go module in this repository, which is why the Pages
# workflow points setup-go at site/go.mod.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[markup]
  [markup.highlight]
    # Class-based highlighting rather than inline styles, so the code blocks
    # follow the light/dark switch instead of being painted once at build time.
    noClasses = false
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

  # The typographer stays on for quotes, but its dash substitutions are
  # neutralised: it rewrites "--" as an en dash, which would turn every CLI
  # flag and every C# "--" in prose into a dash character that cannot be
  # copied and run.
  [markup.goldmark.extensions.typographer]
    enDash = "--"
    emDash = "---"

[params]
  description = "Namespaced response caching for ASP.NET Core — Memory, Redis, SQL Server, and Azure Cosmos DB."

  # Both off: layouts/_partials/navbar-title.html draws the mark itself, inlined
  # so it takes its colour from the page rather than being two fixed images.
  [params.navbar]
    displayTitle = false
    displayLogo = false
    width = "normal"

  # The footer is layouts/_partials/custom/footer.html, filled from
  # [params.oss] below; the theme's copyright and "Powered by" rows are off.
  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = "normal"

  # The page, navbar and footer widths, stated on every project docs site so
  # their columns line up when you move from one to the next.
  [params.page]
    width = "normal"

  [params.search]
    enable = true
    type = "flexsearch"

    [params.search.flexsearch]
      # Vendored rather than fetched. Hextra's default pulls the bundle from
      # jsDelivr with resources.GetRemote and republishes it locally, so the
      # published page is self-hosted either way — but the *build* then needs
      # the network, and a jsDelivr blip would fail a deploy that has nothing
      # to do with jsDelivr.
      #
      # The vendored copy must stay on the major the theme's index code is
      # written against. Its Document config uses the 0.8 tag syntax
      # (tag: [{ field }]), which 0.7 does not understand — pairing it with a
      # 0.7 bundle builds and publishes cleanly and then returns no results for
      # any query. .github/workflows/pages.yml pins the expected version.
      js = "vendor/flexsearch/flexsearch.bundle.min.js"

  # The light/dark button is the navbar's Theme entry below. It renders
  # layouts/_partials/theme-toggle.html, one sun/moon button shared with the
  # other project docs sites, in place of Hextra's light/dark/system menu.
  # With nothing stored, the reader's system setting picks light or dark.
  # displayToggle governs a second copy, in a sticky bar at the foot of the
  # docs sidebar, doing what the navbar's already does.
  [params.theme]
    default = "system"
    displayToggle = false

# The footer, shared by every project docs site: the markup is
# layouts/_partials/custom/footer.html and the install command is
# layouts/_partials/oss/footer-command.html. Keys are lowercase, as Hugo
# stores them. A link is a site `path`, an absolute `url`, or kind = "bug",
# which opens a new issue with `bug` as its body.
[params.oss]
  name = "ActionCache"
  mark = "ac-mark.svg"
  showname = false
  tagline = "Namespaced response caching for ASP.NET Core. Cache an action with one attribute."
  command = "dotnet add package ActionCache"
  repo = "https://github.com/jzills/action-cache"
  bug = """**What happened**


**What you expected**


**Steps to reproduce**


**Versions**

The ActionCache package and backend you use, and your .NET version (`dotnet --version`).
"""

  # Four links per column, labels of 19 characters or fewer, and a tagline
  # of two lines on every project docs site, so the footers are the same
  # height wherever a reader is.
  [[params.oss.columns]]
    heading = "Get started"
    links = [
      { label = "Install", path = "docs/getting-started/installation/" },
      { label = "Quickstart", path = "docs/getting-started/quickstart/" },
      { label = "Configuration", path = "docs/reference/configuration/" },
      { label = "Backends", path = "docs/backends/" },
    ]
  [[params.oss.columns]]
    heading = "Learn"
    links = [
      { label = "Caching", path = "docs/caching/" },
      { label = "Operations", path = "docs/operations/" },
      { label = "Reliability", path = "docs/reliability/" },
      { label = "Observability", path = "docs/observability/" },
    ]
  [[params.oss.columns]]
    heading = "Project"
    links = [
      { label = "GitHub", url = "https://github.com/jzills/action-cache" },
      { label = "Changelog", url = "https://github.com/jzills/action-cache/blob/HEAD/CHANGELOG.md" },
      { label = "Report a bug", kind = "bug" },
      { label = "MIT license", url = "https://github.com/jzills/action-cache/blob/HEAD/LICENSE" },
    ]

# The bar holds a first visitor's top tasks, the same on each of the project
# sites: Documentation, Quickstart, Releases, Search, GitHub and the
# light/dark button. The landing page's own sections are a scroll away, and a
# menu of them read as its table of contents. Releases is the changelog: the
# package ships to NuGet without GitHub releases.
[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Quickstart"
    pageRef = "/docs/getting-started/quickstart"
    weight = 2
  [[menu.main]]
    name = "Releases"
    url = "https://github.com/jzills/action-cache/blob/HEAD/CHANGELOG.md"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/action-cache"
    weight = 5
    [menu.main.params]
      icon = "github"
  [[menu.main]]
    name = "Theme"
    weight = 6
    [menu.main.params]
      type = "theme-toggle"
