# Hugo configuration for the ActionCache documentation site.
#
# A landing page at / and the documentation under /docs/. The docs layout is
# Hextra's own — adding content/docs/ is what turns on the sidebar, the
# right-hand table of contents and the search below.
baseURL = "https://jzills.github.io/action-cache/"

# The tagline rather than the name: this is the browser tab's text, and Hextra
# titles the home page with it alone and every other page as "Page – this".
title = "Namespaced response caching for ASP.NET Core"

[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the library's build.
# There is no other Go module in this repository, which is why the Pages
# workflow points setup-go at site/go.mod.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[markup]
  [markup.highlight]
    # Class-based highlighting rather than inline styles, so the code blocks
    # follow the light/dark switch instead of being painted once at build time.
    noClasses = false
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

  # The typographer stays on for quotes, but its dash substitutions are
  # neutralised: it rewrites "--" as an en dash, which would turn every CLI
  # flag and every C# "--" in prose into a dash character that cannot be
  # copied and run.
  [markup.goldmark.extensions.typographer]
    enDash = "--"
    emDash = "---"

[params]
  description = "Namespaced response caching for ASP.NET Core — Memory, Redis, SQL Server, and Azure Cosmos DB."

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"

    [params.search.flexsearch]
      # Vendored rather than fetched. Hextra's default pulls the bundle from
      # jsDelivr with resources.GetRemote and republishes it locally, so the
      # published page is self-hosted either way — but the *build* then needs
      # the network, and a jsDelivr blip would fail a deploy that has nothing
      # to do with jsDelivr.
      index = "content"
      js = "vendor/flexsearch/flexsearch.bundle.min.js"

  # Hextra's stock light/dark switch.
  [params.theme]
    default = "system"
    displayToggle = true

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Backends"
    pageRef = "/docs/backends"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/action-cache"
    weight = 4
    [menu.main.params]
      icon = "github"
